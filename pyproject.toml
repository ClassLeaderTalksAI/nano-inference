[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nano-inference"
version = "0.1.0"
description = "Learn LLM serving through routing, streaming, and reproducible experiments."
requires-python = ">=3.12"
dependencies = [
  "anyio>=4,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "prometheus-client>=0.21,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
nano-inference = "nano_inference.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
